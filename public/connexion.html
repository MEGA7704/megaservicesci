<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion administration — MEGA Services SARL U</title><link rel="stylesheet" href="/assets/style.css"></head><body><header id="site-header"></header><main class="login-wrap"><section class="login-card"><div class="brand"><span class="mark">M</span><span><strong>MEGA</strong><small>Administration</small></span></div><h1>Connexion</h1><p style="color:var(--muted)">Accès réservé aux utilisateurs autorisés.</p><form id="loginForm"><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Mot de passe</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%">Se connecter</button><button type="button" id="forgot" class="btn" style="width:100%;margin-top:9px">Mot de passe oublié ?</button><div id="msg" style="margin-top:12px"></div></form></section></main><script src="/assets/app.js"></script><script>MEGA.mount('');(async()=>{try{await MEGA.api('/api/session');location.href='/admin.html'}catch{}})();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries()),m=document.getElementById('msg');try{await MEGA.api('/api/login',{method:'POST',body:JSON.stringify(d)});location.href='/admin.html'}catch(err){m.className='notice error';m.textContent=err.data?.message||'Identifiants incorrects.'}});document.getElementById('forgot').onclick=()=>{const m=document.getElementById('msg');m.className='notice';m.textContent="Demandez à un administrateur autorisé de réinitialiser votre mot de passe. Pour le compte administrateur principal, utilisez la procédure sécurisée Cloudflare décrite dans le README du projet."}</script></body></html>
